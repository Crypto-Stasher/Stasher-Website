# Tracked copy of the live prod nginx server block.
# On the box: /etc/nginx/sites-available/stasher  (symlinked into sites-enabled).
# TLS lines are managed by Certbot. `root` points at the release symlink, so a
# deploy.sh symlink swap changes the live content with no nginx reload.
#
# Keep this file in sync with prod by hand (or have Jenkins assert it matches).

server {
    server_name stasherwallet.com www.stasherwallet.com;

    root /var/www/stasher/current;
    index index.html;

    # Prerendered routes are directories (/security/index.html), so nginx 301s
    # /security -> /security/. Keep that redirect relative: the absolute form
    # embeds scheme and port, which downgrades HTTPS deep links to HTTP if a
    # proxy or non-default port is ever in front.
    absolute_redirect off;

    # Backend (stasher-api: newsletter + preorder). Without this block /api/*
    # falls through to the SPA fallback below, and nginx answers a form POST
    # with 405 Not Allowed (it will not serve a static file for POST) — which
    # is exactly why the newsletter form failed in prod.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        # Real client IP for the app's rate limiter (Express trust proxy reads these).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Every real route is prerendered to its own directory, so an unmatched URL
    # is genuinely missing: answer 404 and serve vike's prerendered 404 page,
    # rather than returning index.html with a 200 (a "soft 404" that tells
    # crawlers a nonexistent URL is a valid page).
    #
    # NOTE: this assumes all routes exist as prerendered files. If a
    # client-side-only route is ever added, it must either be prerendered too
    # or listed here, otherwise deep links to it will 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stasherwallet.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stasherwallet.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.stasherwallet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = stasherwallet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name stasherwallet.com www.stasherwallet.com;
    return 404; # managed by Certbot
}

